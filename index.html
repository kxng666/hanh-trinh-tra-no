<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dragon Grind - HTML5 RPG</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="game-wrap">
  <canvas id="game" width="1100" height="650"></canvas>

  <div id="hud">
    <div class="panel player-panel">
      <b id="playerName">Công</b>
      <span>Lv.<strong id="level">1</strong></span>
      <div class="bar hp"><i id="hpBar"></i><label id="hpText"></label></div>
      <div class="bar ki"><i id="kiBar"></i><label id="kiText"></label></div>
      <div class="bar exp"><i id="expBar"></i><label id="expText"></label></div>
      <div class="stats">ATK <b id="atk">12</b> · DEF <b id="def">5</b> · 💰 <b id="gold">0</b></div>
    </div>

    <div class="panel quest-panel">
      <b>NHIỆM VỤ</b>
      <div>Đánh quái: <span id="questKills">0</span>/10</div>
      <small>Thưởng: 500 vàng + EXP</small>
    </div>

    <div class="panel controls">
      <b>ĐIỀU KHIỂN</b><br>
      WASD / ←↑↓→: Di chuyển<br>
      SPACE: Đánh · Q: Kỹ năng<br>
      E: Nói chuyện NPC · I: Túi đồ<br>
      P: Lưu game
    </div>
  </div>

  <div id="inventory" class="modal hidden">
    <div class="modal-box">
      <button class="close" onclick="toggleInventory()">×</button>
      <h2>🎒 TÚI ĐỒ</h2>
      <div id="items"></div>
    </div>
  </div>

  <div id="message"></div>
  <div id="start" class="overlay">
    <div class="start-box">
      <h1>DRAGON GRIND</h1>
      <p>2D HTML5 RPG · Cày cuốc · Lên cấp · Đánh Boss</p>
      <input id="nameInput" maxlength="16" value="Công" placeholder="Tên nhân vật">
      <button id="startBtn">BẮT ĐẦU</button>
      <p class="hint">Không cần server. Game tự lưu trên trình duyệt.</p>
    </div>
  </div>
</div>
<script src="js/save.js"></script>
<script src="js/inventory.js"></script>
<script src="js/skills.js"></script>
<script src="js/map.js"></script>
<script src="js/enemy.js"></script>
<script src="js/player.js"></script>
<script src="js/combat.js"></script>
<script src="js/main.js"></script>
</body>
</html>
